<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00d64f"><link rel="manifest" href="manifest.webmanifest"><title>Cash App Clone Demo</title><style>body{margin:0;font-family:system-ui;background:#f5f5f5;color:#111}.app{max-width:480px;min-height:100vh;margin:auto;background:#fff}.top{padding:28px 20px 18px;border-bottom:1px solid #eee}.badge{font-size:11px;font-weight:800;background:#dffbe8;color:#08752f;padding:6px 9px;border-radius:99px}.balance{font-size:38px;font-weight:800;margin-top:10px}.main{padding:20px}.amount{text-align:center;font-size:52px;font-weight:800;padding:25px 0}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key,.btn{border:0;border-radius:18px;padding:18px;font-size:20px;font-weight:800;background:#eee}.btn{font-size:16px}.green{background:#00d64f}.dark{background:#111;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:#fff;padding:15px;font-weight:800}.card{border:1px solid #eee;border-radius:20px;padding:16px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center}input{width:100%;box-sizing:border-box;padding:15px;border:1px solid #ddd;border-radius:14px;margin:8px 0}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:end}.sheet{background:#fff;width:100%;max-width:480px;margin:auto;padding:24px;border-radius:25px 25px 0 0;box-sizing:border-box}.screen{display:none}.screen.active{display:block}</style></head><body><div class="app"><div class="top"><span class="badge">DEMO • NO REAL MONEY</span><div id="bal" class="balance">$6,724.78</div><small>Android web edition</small></div><div class="main"><section id="home" class="screen active"><div id="amt" class="amount">$0</div><div class="keys"><button class="key" onclick="tap(1)">1</button><button class="key" onclick="tap(2)">2</button><button class="key" onclick="tap(3)">3</button><button class="key" onclick="tap(4)">4</button><button class="key" onclick="tap(5)">5</button><button class="key" onclick="tap(6)">6</button><button class="key" onclick="tap(7)">7</button><button class="key" onclick="tap(8)">8</button><button class="key" onclick="tap(9)">9</button><button class="key" onclick="tap(0)">0</button><button class="key" onclick="back()">⌫</button><button class="key" onclick="clr()">C</button></div><div class="actions"><button class="btn green" onclick="pay()">Pay</button><button class="btn dark" onclick="show('balance')">Balance</button></div></section><section id="balance" class="screen"><h2>Balance</h2><div class="card"><div id="big" class="balance">$6,724.78</div></div><button class="btn green" onclick="change()">Change demo balance</button></section><section id="activity" class="screen"><h2>Activity</h2><div id="list"></div></section></div><div class="nav"><button onclick="show('home')">⌂<br>Home</button><button onclick="show('activity')">↕<br>Activity</button><button onclick="show('balance')">$<br>Balance</button></div></div><div id="modal" class="modal"><div class="sheet"><h2>Pay demo</h2><input id="who" placeholder="Name or $cashtag"><input id="note" placeholder="Note (optional)"><div class="actions"><button class="btn dark" onclick="modal.style.display='none'">Cancel</button><button class="btn green" onclick="send()">Send</button></div></div></div><script>let s=JSON.parse(localStorage.cashclone||'null')||{b:6724.78,a:[['Samuel',50],['Ethan Williams',75],['Kyle',40]]},n=0;function m(x){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(x)}function r(){bal.textContent=m(s.b);big.textContent=m(s.b);amt.textContent=m(n);list.innerHTML=s.a.map(x=>'<div class="card"><div class="row"><b>'+x[0]+'</b><b>'+m(x[1])+'</b></div></div>').join('')}function save(){localStorage.cashclone=JSON.stringify(s);r()}function tap(x){if(String(n).length<6)n=Number(String(n)+x);r()}function back(){n=Math.floor(n/10);r()}function clr(){n=0;r()}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');r()}function pay(){if(!n)return alert('Enter an amount');modal.style.display='flex';who.focus()}function send(){if(!who.value.trim())return alert('Enter a recipient');if(n>s.b)return alert('Demo balance too low');s.b-=n;s.a.unshift([who.value.trim(),n]);n=0;who.value='';modal.style.display='none';save();show('activity')}function change(){let v=prompt('New demo balance',s.b.toFixed(2));if(v!==null&&!isNaN(v)&&+v>=0){s.b=+v;save()}}r();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
